// ============================================================================
// Source: mobile/android/app/build.gradle
// Version: 0.1.0 — 2026-09-10
// Why: Top-level build for the Android app. Generated by Capacitor; the Kotlin
//      plugin is added because the widgets are Kotlin, sharing im.taghv.core
//      with the tests that hold it to the site's own dates.
// Env / Deps: AGP 8.13.0, Kotlin 2.4.0 — the version mobile/android/core uses.
// ============================================================================

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
